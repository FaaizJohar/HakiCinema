version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: hakibox-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hakibox
    ports:
      - "5432:5432"
    volumes:
      - hakibox-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hakibox-db-data:
